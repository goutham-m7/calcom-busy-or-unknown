name: Calendar regression pack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-lab:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-lab-node-${{ matrix.node }}
          path: artifacts/
